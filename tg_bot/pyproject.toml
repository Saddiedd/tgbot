[project]
name = "tg-bot"
version = "0.1.0"
description = "Telegram LLM ReAct bot for KOMPAS-3D learning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.19.0",
    "aiohttp>=3.9.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
